<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="ポケモンカード価格監視ツール">
  <meta name="theme-color" content="#6366f1">
  <title>ポケカ価格モニター</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* 即座に表示されるローディング画面 */
    #app-loader{position:fixed;inset:0;background:#0f1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s}
    #app-loader.hide{opacity:0;pointer-events:none}
    #app-loader h2{color:#e4e6ef;font-size:1.2rem;margin-top:16px;font-family:-apple-system,sans-serif}
    #app-loader p{color:#6b7280;font-size:.85rem;margin-top:8px;font-family:-apple-system,sans-serif}
    #app-loader .lds{width:40px;height:40px;border:3px solid #2d3244;border-top:3px solid #6366f1;border-radius:50%;animation:sp .8s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <!-- 即座表示ローダー -->
  <div id="app-loader">
    <div class="lds"></div>
    <h2>⚡ ポケカモニター</h2>
    <p>データ読み込み中...</p>
  </div>

  <div class="app-layout">
    <!-- サイドバーオーバーレイ（モバイル用） -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- サイドバー -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo">⚡</span>
        <h1>ポケカモニター</h1>
      </div>
      <div class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <span class="icon">📊</span> ダッシュボード
        </button>
        <button class="nav-item" data-view="cards" id="nav-cards">
          <span class="icon">🃏</span> カード管理
        </button>
        <button class="nav-item" data-view="shops" id="nav-shops">
          <span class="icon">🏪</span> ショップ管理
        </button>
        <button class="nav-item" data-view="alerts" id="nav-alerts">
          <span class="icon">🔔</span> アラート設定
        </button>
      </div>
      <div style="padding:12px;border-top:1px solid var(--border);font-size:.75rem;color:var(--text-muted)">
        v1.0.0 | 機能重視設計
      </div>
    </nav>

    <!-- メインエリア -->
    <div class="main-area">
      <!-- ヘッダー -->
      <header class="top-header">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <span class="header-title" id="header-title">📊 ダッシュボード</span>
        <div class="header-spacer"></div>

        <!-- 巡回コントロール -->
        <div class="patrol-control">
          <span class="patrol-label">自動巡回</span>
          <label class="toggle-switch">
            <input type="checkbox" id="patrol-toggle">
            <span class="toggle-slider"></span>
          </label>
          <span class="patrol-status stopped" id="patrol-status-badge">⏹ 停止中</span>
          <div class="interval-control">
            <input type="number" id="patrol-interval-input" value="30" min="5" max="120" title="巡回間隔(分)">
            <span>分</span>
          </div>
        </div>
      </header>

      <!-- コンテンツ -->
      <main class="content">
        <div id="view-dashboard" class="view active">
          <div class="loading-overlay"><span class="spinner"></span> 読み込み中...</div>
        </div>
        <div id="view-cards" class="view">
          <div class="loading-overlay"><span class="spinner"></span> 読み込み中...</div>
        </div>
        <div id="view-shops" class="view">
          <div class="loading-overlay"><span class="spinner"></span> 読み込み中...</div>
        </div>
        <div id="view-alerts" class="view">
          <div class="loading-overlay"><span class="spinner"></span> 読み込み中...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts (defer) -->
  <script src="/js/api.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/dashboard.js" defer></script>
  <script src="/js/cards.js" defer></script>
  <script src="/js/shops.js" defer></script>
  <script src="/js/alerts.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
